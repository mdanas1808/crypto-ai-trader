services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crypto_trader
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto_trader"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
